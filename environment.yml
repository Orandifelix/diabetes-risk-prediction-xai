# ─────────────────────────────────────────────
# Diabetes Risk Predictor — environment.yml
# Conda environment specification
# ─────────────────────────────────────────────
# Create:  conda env create -f environment.yml
# Activate: conda activate diabetes-xai
# Update:  conda env update -f environment.yml --prune
# Remove:  conda env remove -n diabetes-xai
# ─────────────────────────────────────────────

name: diabetes-xai

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ──────────────────────────────────
  - python=3.12

  # ── Data Manipulation ───────────────────────
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1

  # ── Machine Learning ────────────────────────
  - scikit-learn=1.5.0
  - xgboost=2.0.3
  - lightgbm=4.3.0
  - imbalanced-learn=0.12.3

  # ── Model Persistence ───────────────────────
  - joblib=1.4.2

  # ── Data Visualization ──────────────────────
  - matplotlib=3.9.0
  - seaborn=0.13.2
  - plotly=5.22.0

  # ── Notebook Support ────────────────────────
  - jupyter=1.0.0
  - nbformat=5.10.4
  - nbconvert=7.16.4
  - ipykernel=6.29.4
  - ipywidgets=8.1.3

  # ── Hyperparameter Tuning ───────────────────
  - optuna=3.6.1

  # ── Utilities ───────────────────────────────
  - python-dotenv=1.0.1
  - pyyaml=6.0.1
  - tqdm=4.66.4

  # ── Code Quality ────────────────────────────
  - ruff=0.4.7

  # ── Pip-only packages ───────────────────────
  # (not available on conda-forge or best installed via pip)
  - pip
  - pip:
      - shap==0.45.1
      - lime==0.2.0.1
      - catboost==1.2.5
