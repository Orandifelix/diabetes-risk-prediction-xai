name: Repository CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
# ==========================================================
# Repository Structure Validation
# ==========================================================
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate root files
        run: |
          echo "Checking repository..."

          files=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            requirements.txt
            environment.yml
            .gitignore
          )

          for file in "${files[@]}"; do
            test -f "$file" || (echo "❌ Missing $file" && exit 1)
          done

          echo "✅ Root files verified"

      - name: Validate notebooks
        run: |
          test -f notebooks/diabetes_prediction.ipynb || exit 1
          test -f notebooks/notebook.pdf || exit 1
          echo "✅ Notebooks verified"

      - name: Validate models
        run: |
          test -f models/final_model.joblib
          test -f models/preprocessor.joblib
          test -f models/metadata.json
          echo "✅ Models verified"

      - name: Validate documentation
        run: |
          test -f docs/architecture.md
          test -f docs/dashboard.md
          test -f docs/methodology.md
          echo "✅ Documentation verified"

      - name: Validate reports
        run: |
          test -f reports/proposal.pdf
          test -f reports/final_report.pdf
          echo "✅ Reports verified"

      - name: Validate presentation
        run: |
          test -f presentations/presentation.pdf
          test -f presentations/deployment_presentation.pptx
          echo "✅ Presentation verified"

      - name: Validate submission
        run: |
          test -f submission/notebook.pdf
          test -f submission/github.pdf
          test -f submission/presentation.pdf
          echo "✅ Submission verified"

      - name: Validate directories
        run: |
          dirs=(
            app
            datasets/raw
            datasets/processed
            images/01_data_understanding
            images/02_eda
            images/03_feature_engineering
            images/04_modeling
            images/05_evaluation
            images/06_interpretability
            images/07_dashboard
            images/08_presentation
          )

          for dir in "${dirs[@]}"; do
            test -d "$dir" || (echo "❌ Missing $dir" && exit 1)
          done

          echo "✅ Directory structure verified"

      - name: Show repository tree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tree
          tree -L 3 -I '.git|node_modules'

# ==========================================================
# Python Checks
# ==========================================================
  python-checks:
    name: Python Quality Checks
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff nbformat pyyaml

      - name: Ruff (Application Code)
        continue-on-error: true
        run: |
          echo "Running Ruff..."

          PY_FILES=$(find app -name "*.py")

          if [ -z "$PY_FILES" ]; then
            echo "ℹ️ No application Python files found."
          else
            ruff check $PY_FILES
          fi

      - name: Validate all notebooks
        run: |
          python - <<EOF
          import glob
          import nbformat
          import sys

          notebooks = glob.glob("notebooks/*.ipynb")

          if not notebooks:
              print("⚠️ No notebooks found.")
              sys.exit(0)

          for notebook in notebooks:
              print(f"Checking {notebook}...")
              with open(notebook, encoding="utf-8") as f:
                  nb = nbformat.read(f, as_version=4)
              nbformat.validate(nb)

          print(f"✅ Validated {len(notebooks)} notebook(s).")
          EOF

      - name: Validate environment.yml
        run: |
          python - <<EOF
          import yaml

          with open("environment.yml") as f:
              env=yaml.safe_load(f)

          print("✅ environment.yml valid")
          print(env.get("name"))
          EOF

# ==========================================================
# Summary
# ==========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - validate-structure
      - python-checks

    if: always()

    steps:
      - name: Display Results
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "      Diabetes Risk Predictor CI"
          echo "════════════════════════════════════════════"

          echo "Repository Structure : ${{ needs.validate-structure.result }}"
          echo "Python Validation    : ${{ needs.python-checks.result }}"

          echo "════════════════════════════════════════════"

          if [ "${{ needs.validate-structure.result }}" != "success" ]; then
              echo "❌ Repository validation failed."
              exit 1
          fi

          if [ "${{ needs.python-checks.result }}" != "success" ]; then
              echo "⚠️ Python validation completed with warnings."
              echo "Review Ruff output for style improvements."
          else
              echo "✅ All validation checks passed."
          fi

          echo "════════════════════════════════════════════"