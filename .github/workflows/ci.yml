name: Repository CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Validate repository structure
  # ─────────────────────────────────────────────
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root files
        run: |
          echo "Checking root files..."
          test -f README.md        || (echo "❌ Missing README.md" && exit 1)
          test -f LICENSE          || (echo "❌ Missing LICENSE" && exit 1)
          test -f CHANGELOG.md     || (echo "❌ Missing CHANGELOG.md" && exit 1)
          test -f CONTRIBUTING.md  || (echo "❌ Missing CONTRIBUTING.md" && exit 1)
          test -f requirements.txt || (echo "❌ Missing requirements.txt" && exit 1)
          test -f environment.yml  || (echo "❌ Missing environment.yml" && exit 1)
          test -f .gitignore       || (echo "❌ Missing .gitignore" && exit 1)
          echo "✅ Root files OK"

      - name: Validate GitHub workflow
        run: |
          echo "Checking workflow files..."
          test -f .github/workflows/ci.yml || (echo "❌ Missing ci.yml" && exit 1)
          echo "✅ Workflow files OK"

      - name: Validate notebooks
        run: |
          echo "Checking notebooks..."
          test -f notebooks/diabetes_prediction.ipynb || (echo "❌ Missing diabetes_prediction.ipynb" && exit 1)
          test -f notebooks/notebook.pdf              || (echo "❌ Missing notebook.pdf" && exit 1)
          echo "✅ Notebooks OK"

      - name: Validate models
        run: |
          echo "Checking model artifacts..."
          test -f models/final_model.joblib   || (echo "❌ Missing final_model.joblib" && exit 1)
          test -f models/preprocessor.joblib  || (echo "❌ Missing preprocessor.joblib" && exit 1)
          test -f models/metadata.json        || (echo "❌ Missing metadata.json" && exit 1)
          echo "✅ Model artifacts OK"

      - name: Validate documentation
        run: |
          echo "Checking docs..."
          test -f docs/architecture.md  || (echo "❌ Missing architecture.md" && exit 1)
          test -f docs/dashboard.md     || (echo "❌ Missing dashboard.md" && exit 1)
          test -f docs/methodology.md   || (echo "❌ Missing methodology.md" && exit 1)
          echo "✅ Documentation OK"

      - name: Validate reports
        run: |
          echo "Checking reports..."
          test -f reports/proposal.pdf    || (echo "❌ Missing proposal.pdf" && exit 1)
          test -f reports/final_report.pdf || (echo "❌ Missing final_report.pdf" && exit 1)
          echo "✅ Reports OK"

      - name: Validate presentations
        run: |
          echo "Checking presentations..."
          test -f presentations/presentation.pdf  || (echo "❌ Missing presentation.pdf" && exit 1)
          test -f presentations/presentation.pptx || (echo "❌ Missing presentation.pptx" && exit 1)
          test -f presentations/speaker_notes.md  || (echo "❌ Missing speaker_notes.md" && exit 1)
          echo "✅ Presentations OK"

      - name: Validate submission
        run: |
          echo "Checking submission files..."
          test -f submission/notebook.pdf     || (echo "❌ Missing submission/notebook.pdf" && exit 1)
          test -f submission/github.pdf       || (echo "❌ Missing submission/github.pdf" && exit 1)
          test -f submission/presentation.pdf || (echo "❌ Missing submission/presentation.pdf" && exit 1)
          echo "✅ Submission files OK"

      - name: Validate directories
        run: |
          echo "Checking directories..."
          test -d app                          || (echo "❌ Missing app/" && exit 1)
          test -d datasets/raw                 || (echo "❌ Missing datasets/raw/" && exit 1)
          test -d datasets/processed           || (echo "❌ Missing datasets/processed/" && exit 1)
          test -d images/01_data_understanding || (echo "❌ Missing images/01_data_understanding/" && exit 1)
          test -d images/02_eda               || (echo "❌ Missing images/02_eda/" && exit 1)
          test -d images/03_feature_engineering || (echo "❌ Missing images/03_feature_engineering/" && exit 1)
          test -d images/04_modeling           || (echo "❌ Missing images/04_modeling/" && exit 1)
          test -d images/05_evaluation         || (echo "❌ Missing images/05_evaluation/" && exit 1)
          test -d images/06_interpretability   || (echo "❌ Missing images/06_interpretability/" && exit 1)
          test -d images/07_dashboard          || (echo "❌ Missing images/07_dashboard/" && exit 1)
          test -d images/08_presentation       || (echo "❌ Missing images/08_presentation/" && exit 1)
          echo "✅ Directories OK"

      - name: Display repository tree
        run: |
          sudo apt-get install -y -qq tree
          tree -a --dirsfirst -I '.git'
          echo "✅ Repository structure displayed"

  # ─────────────────────────────────────────────
  # JOB 2 — Python environment and code quality
  # ─────────────────────────────────────────────
  python-checks:
    name: Python Quality Checks
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install notebook validation tools
        run: pip install nbformat ruff

      - name: Lint Python files (ruff)
        # Only runs when .py files exist — safe to run even if app/ is empty
        run: |
          PY_FILES=$(find . -name "*.py" -not -path "./.git/*" -not -path "./datasets/*")
          if [ -z "$PY_FILES" ]; then
            echo "ℹ️  No Python files found yet — skipping lint"
          else
            echo "Running ruff on Python files..."
            ruff check $PY_FILES
            echo "✅ Lint passed"
          fi

      - name: Validate notebook format
        run: |
          echo "Validating notebook JSON structure..."
          python -c "
          import nbformat, sys
          nb_path = 'notebooks/diabetes_prediction.ipynb'
          with open(nb_path) as f:
              nb = nbformat.read(f, as_version=4)
          nbformat.validate(nb)
          print('✅ Notebook format valid — nbformat version:', nb.nbformat)
          "

      - name: Validate metadata.json
        run: |
          echo "Validating models/metadata.json..."
          python -c "
          import json, sys
          with open('models/metadata.json') as f:
              meta = json.load(f)
          print('✅ metadata.json is valid JSON')
          print('   Keys found:', list(meta.keys()))
          "

      - name: Validate environment.yml is parseable
        run: |
          pip install pyyaml -q
          python -c "
          import yaml
          with open('environment.yml') as f:
              env = yaml.safe_load(f)
          print('✅ environment.yml is valid YAML')
          print('   Environment name:', env.get('name', 'unnamed'))
          "

  # ─────────────────────────────────────────────
  # JOB 3 — Summary
  # ─────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-structure, python-checks]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "══════════════════════════════════════"
          echo "  Diabetes Risk Predictor — CI Report"
          echo "══════════════════════════════════════"
          echo "  Structure validation : ${{ needs.validate-structure.result }}"
          echo "  Python quality checks: ${{ needs.python-checks.result }}"
          echo "══════════════════════════════════════"
          if [ "${{ needs.validate-structure.result }}" != "success" ] || \
             [ "${{ needs.python-checks.result }}" != "success" ]; then
            echo "❌ CI failed — review the logs above"
            exit 1
          fi
          echo "✅ All checks passed — repository is healthy"
